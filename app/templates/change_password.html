{% extends "base.html" %}
{% block content %}
<h1>Change Password</h1>
<div class="card" style="max-width:420px">
  {% if error %}<div class="error-box">{{ error }}</div><br>{% endif %}
  {% if success %}<div class="card" style="background:#e3f5ea;border-color:#bfe3cd;color:#1e7a4c">{{ success }}</div><br>{% endif %}
  <form method="post" action="/account/change-password">
    <label>Current Password</label>
    <input name="current_password" type="password" required>
    <label>New Password</label>
    <input name="new_password" type="password" required minlength="8">
    <label>Confirm New Password</label>
    <input name="confirm_password" type="password" required minlength="8">
    <p class="muted">At least 8 characters.</p>
    <br>
    <button class="btn" type="submit">Update Password</button>
  </form>
</div>
{% endblock %}
