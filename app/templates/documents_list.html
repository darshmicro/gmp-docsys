{% extends "base.html" %}
{% block content %}
<h1>Document Master</h1>
<a class="btn" href="/documents/new">+ Register New Document</a>
<br><br>
<div class="card">
<table>
  <tr><th>Doc No.</th><th>Title</th><th>Rev</th><th>Status</th></tr>
  {% for d in docs %}
  <tr>
    <td><a href="/documents/{{ d.id }}">{{ d.document_number }}</a></td>
    <td>{{ d.title }}</td>
    <td>{{ d.revision_number }}</td>
    <td><span class="badge {{ d.status|lower }}">{{ d.status }}</span></td>
  </tr>
  {% endfor %}
</table>
</div>
{% endblock %}
